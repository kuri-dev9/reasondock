services:

  mysql:
    image: mysql:8.4
    container_name: chat_demo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_demo
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: chat_demo_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/chat_demo
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4o}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-anthropic/claude-sonnet-4-5}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-exaone3.5:7.8b}
      UCE_ENABLED: ${UCE_ENABLED:-true}
      UCE_BASE_URL: ${UCE_BASE_URL:-http://uce:8100}
      UCE_TIMEOUT_SECONDS: ${UCE_TIMEOUT_SECONDS:-15}
      UCE_DEBUG_ENABLED: ${UCE_DEBUG_ENABLED:-true}
      RCA_DEBUG_ENABLED: ${RCA_DEBUG_ENABLED:-true}
      DPE_ENABLED: ${DPE_ENABLED:-true}
      DPE_BASE_URL: ${DPE_BASE_URL:-http://dpe:8200}
      DPE_TIMEOUT_SECONDS: ${DPE_TIMEOUT_SECONDS:-600}
      DPE_NORMALIZATION_ENABLED: ${DPE_NORMALIZATION_ENABLED:-true}
      DPE_BACKEND_SELF_URL: ${DPE_BACKEND_SELF_URL:-http://backend:8000}
    extra_hosts:
      - "host-gateway:host-gateway"  # Mac/Linux 공통 (Docker 20.10+)
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # 핫리로드용 (개발 시)
      - ./data:/app/data:ro
      - knowledge_data:/app/knowledge_data
      - xdr_uploads:/app/xdr_uploads
      - rca_results:/app/rca_results
    depends_on:
      mysql:
        condition: service_healthy

  dpe:
    build:
      context: ./dpe
    container_name: dpe
    restart: unless-stopped
    environment:
      PORT: 8200
      DPE_NORMALIZATION_ENABLED: ${DPE_NORMALIZATION_ENABLED:-true}
      DPE_NORMALIZATION_MIN_CONFIDENCE: ${DPE_NORMALIZATION_MIN_CONFIDENCE:-0.55}
      DPE_NORMALIZATION_MAX_CHARS: ${DPE_NORMALIZATION_MAX_CHARS:-8000}
      UCE_BASE_URL: ${UCE_BASE_URL:-http://uce:8100}
      UCE_DENOISE_ENABLED: ${UCE_DENOISE_ENABLED:-true}
    ports:
      - "8200:8200"

  uce:
    build:
      context: ./uce
    container_name: uce
    restart: unless-stopped
    environment:
      PORT: 8100
      LOG_LEVEL: ${UCE_LOG_LEVEL:-info}
      UCE_LOG_LEVEL: ${UCE_LOG_LEVEL:-INFO}
    ports:
      - "8100:8100"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_UCE_DEBUG: ${REACT_APP_UCE_DEBUG:-false}
        REACT_APP_RCA_DEBUG: ${REACT_APP_RCA_DEBUG:-true}
        REACT_APP_CHAT_DEBUG: ${REACT_APP_CHAT_DEBUG:-true}
    container_name: chat_demo_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  knowledge_data:
  xdr_uploads:
  rca_results:
